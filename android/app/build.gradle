plugins {
    id 'com.android.application'
}

// The tool list is not duplicated in the app: data/tools.md, data/articles.md and
// data/phases.json are bundled as assets and parsed at runtime.
def generatedAssets = layout.buildDirectory.dir("generated/cheatsheet-assets")

def copyCheatSheet = tasks.register('copyCheatSheet', Copy) {
    from(rootProject.file('../data/tools.md'))
    from(rootProject.file('../data/articles.md'))
    from(rootProject.file('../data/phases.json'))
    into(generatedAssets)
}

android {
    namespace 'io.github.osintcheatsheet'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.osintcheatsheet'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    sourceSets {
        main.assets.srcDirs += generatedAssets
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyCheatSheet }
